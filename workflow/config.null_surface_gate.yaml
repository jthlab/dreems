# Graph-level null-surface gate. This reuses the prepared sampling-robustness
# corpus and freezes every parameter in the existing candidate checkpoint.
outdir: /scratch/jonth_root/jonth0/jonth/dreems/null_surface_gate_20260831
publish_dir: /home/jonth/turbo/dreems/null_surface_gate_20260831
source_run: /scratch/jonth_root/jonth0/jonth/dreems/sampling_robustness_20260830
base_checkpoint: /home/jonth/turbo/dreems/sampling_robustness_20260830/dreems_sampling_robustness_candidate.dreems.zip
exact_input_pattern: /scratch/jonth_root/jonth0/jonth/dreems/feems_scenarios_exact_h2h_20260830/work/inputs/example_{example}.pkl
exact_metadata_pattern: /scratch/jonth_root/jonth0/jonth/dreems/feems_scenarios_exact_h2h_20260830/work/inputs/example_{example}.metadata.json
exact_baseline_pattern: /scratch/jonth_root/jonth0/jonth/dreems/feems_scenarios_exact_h2h_20260830/work/dreems/example_{example}.npz
validation_baseline_pattern: /scratch/jonth_root/jonth0/jonth/dreems/null_surface_shrinkage_20260831/evaluation/pack_{pack}/predictions.npz

uv_run_args: --frozen --no-sync
xla_mem_fraction: "0.55"
train_validation_examples: 1024

dreems:
  architecture:
    hidden_channels: 128
    layers: 10
    context_layers: 3
    initializer_gate: true
    initializer_gate_initial_logit: 4.0
    surface_gate: true
    surface_gate_initial_logit: 6.0
  features:
    covariance_components: 20
    normalization_std_floor: 0.2
    spatial_encoding: topology_node_covariance
  edge_conditioner:
    smoothness: 0.01
    ridge_scale: 0.001
    pair_weight_power: 0.0
    length_weighted_baseline: true
    output_sd: 1.0
    batch_size: 256
  loss:
    min_logvar: -7.0
    max_logvar: 5.0
    context_weight: 0.5
    q_weight: 0.5
    slope_weight: 0.25
    slope_target: 1.0
    slope_target_floor: 0.05
    slope_huber_delta: 1.0
    correlation_weight: 0.2
    correlation_target_floor: 0.05
    orientation_weight: 0.35
    orientation_target_floor: 0.05
    orientation_margin_fraction: 0.5
    initializer_regret_weight: 0.5
    initializer_regret_margin: 0.0
    counterfactual_consistency_weight: 0.1
    surface_gate_weight: 1.0
    surface_gate_target_floor: 0.05
  optimizer:
    seed: 20260921
    steps: 10000
    batch_size: 8
    learning_rate: 5.0e-4
    gradient_clip_norm: 1.0
    log_every: 250
    early_stopping_patience: 12
    early_stopping_min_delta: 0.0001
    early_stopping_warmup_steps: 1500
    early_stopping_metric: validation_loss
    restore_best_validation: true
    trainable_scope: surface_gate

train_threads: 4
train_mem_mb: 32000
train_runtime: 12h
train_partition: gpu_mig40,spgpu,gpu

eval_threads: 1
eval_mem_mb: 8000
eval_runtime: 60m
eval_partition: standard

analysis_threads: 1
analysis_mem_mb: 8000
analysis_runtime: 30m
analysis_partition: standard
