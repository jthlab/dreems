[project]
name = "dreems"
version = "0.3.0"
description = "Deep Recovery of Effective Migration Surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.19.0",
    "equinox>=0.13.8",
    "jax>=0.8.0,<0.11",
    "jaxtyping>=0.3.0",
    "msprime>=1.3",
    "numpy>=2.0.0",
    "optax>=0.2.5",
    "pyyaml>=6.0.2",
    "scipy>=1.14.0",
    "xarray>=2025.1.0",
]

[project.scripts]
dreems = "dreems.cli:main"

[project.optional-dependencies]
cuda = [
    "jax[cuda12]>=0.8.0,<0.11",
]
feems = [
    "cartopy>=0.24",
    "feems @ git+https://github.com/NovembreLab/feems.git",
    "scikit-sparse>=0.4.16,<0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]
workflow = [
    "cartopy>=0.24",
    "matplotlib>=3.9",
    "pyproj>=3.7",
    "shapely>=2.0",
    "snakemake>=9.0.0",
    "snakemake-executor-plugin-slurm>=2.7.1",
]
rust = [
    "maturin>=1.7,<2",
]
notebook = [
    "ipykernel>=6.29",
    "jupytext>=1.17",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]
manuscript = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dreems.data" = ["*.dreems.zip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
